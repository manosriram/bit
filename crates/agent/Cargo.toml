[package]
name = "agent"
version.workspace = true
edition.workspace = true

[dependencies]
llm = { path = "../llm" }
tools = { path = "../tools" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util"] }
